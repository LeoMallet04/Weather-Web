<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- <button onclick="verifyWeather()">TESTE</button> -->

       <center>

            <div class="timer" id="timer"></div>
            <section class="weatherSection" id="weatherSection">
                <div class ="nav">
                    <input type="text" class="navText" id="navText">
                    <button class="navButton" onclick="getWeather()"> <img src="/assets/search.svg" alt="" class="navButtonImg"></button>
                </div>
                
                <div class="weather">
                    <img class="image" id="image" src="/assets/Sunday-Clear.svg" alt="">
                    <div class="temperature" id="temp">19ºC</div>
                    <div class="location" id="loc">New York</div>

                    <div class="weatherDatas">
                        <img src="/assets/iconegota.svg" alt="">
                        <div class="humidity" id="humidity">%19</div>
                        <img src="/assets/Wind.svg" alt="">
                        <div class="wind" id="wind">6.29km/h</div>
                    </div>
                </div>  
                 
            </section>
       </center> 
       <script src="javascript.js"></script>
</body>
</html>
